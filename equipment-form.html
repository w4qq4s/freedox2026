<!DOCTYPE html>
<html lang="en" class="bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>freedox2026 — Equipment form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <script type="module">
      import { api, requireSession, hasRank, escapeHtml, toast } from "/js/api.js";
      import { renderShell } from "/js/shell.js";

      const user = requireSession();
      const editId = new URLSearchParams(location.search).get("id");

      if (user && !hasRank(user.role, "dept_head")) {
        // Lab assistants cannot create/fully-edit; only status via the detail page.
        location.href = "/equipment.html";
      } else if (user) {
        const { page } = renderShell("equipment", editId ? "Edit equipment" : "Add equipment");
        await build(page);
      }

      async function build(page) {
        page.innerHTML = '<div class="row"><div class="spinner"></div></div>';
        const [labs, categories] = await Promise.all([api("/laboratories"), api("/categories")]);
        let existing = null;
        if (editId) {
          const d = await api(`/equipment/${editId}`);
          existing = d.equipment;
        }

        page.innerHTML = `
          <a href="${editId ? `/equipment-detail.html?id=${editId}` : "/equipment.html"}" class="muted" style="font-size:13px">← Back</a>
          <div class="card mt-4" style="max-width:640px">
            <form id="eq-form">
              <div class="field"><label>Name</label>
                <input id="e-name" required maxlength="150" value="${existing ? escapeHtml(existing.name) : ""}" />
                <div id="dup-warn" class="hint" style="color:var(--warn)"></div>
              </div>
              <div class="grid" style="grid-template-columns:1fr 1fr">
                <div class="field"><label>Laboratory</label>
                  <select id="e-lab" required>
                    ${labs.map((l) => `<option value="${l.id}" ${existing && existing.laboratory_id === l.id ? "selected" : ""}>${escapeHtml(l.name)}</option>`).join("")}
                  </select></div>
                <div class="field"><label>Category</label>
                  <select id="e-cat" required>
                    ${categories.map((c) => `<option value="${c.id}" ${existing && existing.category_id === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
                  </select></div>
              </div>
              <div class="grid" style="grid-template-columns:1fr 1fr">
                <div class="field"><label>Quantity</label>
                  <input type="number" id="e-qty" min="0" required value="${existing ? existing.quantity : 1}" /></div>
                <div class="field"><label>Purchase year</label>
                  <input type="number" id="e-year" min="1990" max="2100" required value="${existing ? existing.purchase_year : new Date().getFullYear()}" /></div>
              </div>
              <div class="field"><label>Status</label>
                <select id="e-status" required>
                  <option value="functional" ${!existing || existing.status === "functional" ? "selected" : ""}>Functional</option>
                  <option value="under_maintenance" ${existing && existing.status === "under_maintenance" ? "selected" : ""}>Under maintenance</option>
                  <option value="non_functional" ${existing && existing.status === "non_functional" ? "selected" : ""}>Non-functional</option>
                </select></div>
              <div class="field err hidden" id="e-err"></div>
              <div class="row" style="justify-content:flex-end">
                <button type="submit" class="btn primary">${editId ? "Save changes" : "Create equipment"}</button>
              </div>
            </form>
          </div>`;

        const nameEl = document.getElementById("e-name");
        const catEl = document.getElementById("e-cat");
        const dupWarn = document.getElementById("dup-warn");

        // Live duplicate detection (non-blocking warning).
        let dupTimer;
        const checkDup = () => {
          clearTimeout(dupTimer);
          const name = nameEl.value.trim();
          if (name.length < 2) {
            dupWarn.textContent = "";
            return;
          }
          dupTimer = setTimeout(async () => {
            try {
              const params = new URLSearchParams({ name, category_id: catEl.value });
              const hits = await api(`/equipment/duplicate-check?${params.toString()}`);
              const filtered = existing ? hits.filter((h) => h.name !== existing.name) : hits;
              if (filtered.length) {
                dupWarn.textContent = `Possible duplicate: "${filtered[0].name}" in ${filtered[0].laboratory_name} (${Math.round(filtered[0].similarity * 100)}% match)`;
              } else {
                dupWarn.textContent = "";
              }
            } catch {
              /* non-blocking */
            }
          }, 300);
        };
        nameEl.addEventListener("input", checkDup);
        catEl.addEventListener("change", checkDup);

        document.getElementById("eq-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const errBox = document.getElementById("e-err");
          errBox.classList.add("hidden");
          const payload = {
            name: nameEl.value.trim(),
            laboratory_id: Number(document.getElementById("e-lab").value),
            category_id: Number(catEl.value),
            quantity: Number(document.getElementById("e-qty").value),
            purchase_year: Number(document.getElementById("e-year").value),
            status: document.getElementById("e-status").value,
          };
          try {
            if (editId) {
              await api(`/equipment/${editId}`, { method: "PATCH", body: payload });
              toast("Equipment updated", "success");
              location.href = `/equipment-detail.html?id=${editId}`;
            } else {
              const created = await api("/equipment", { method: "POST", body: payload });
              toast("Equipment created", "success");
              location.href = `/equipment-detail.html?id=${created.id}`;
            }
          } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.remove("hidden");
          }
        });
      }
    </script>
  </body>
</html>
